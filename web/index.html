<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleepy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3348;
  --text:#e4e4e7;--text2:#a1a1aa;--accent:#6366f1;--accent-hover:#818cf8;
  --green:#22c55e;--yellow:#eab308;--blue:#3b82f6;--red:#ef4444;
  --radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent);text-decoration:none}

/* Header */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header span.subtitle{color:var(--text2);font-size:14px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:4px 8px;outline:none;cursor:pointer}
.lang-select:focus{border-color:var(--accent)}
.settings-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:16px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s}
.settings-btn:hover{border-color:var(--accent);color:var(--accent)}
.worker-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.worker-dot.on{background:var(--green)}.worker-dot.off{background:var(--text2)}

/* Settings Modal */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.settings-grid .form-group{margin-bottom:0}
.settings-full{grid-column:1/-1}
.mode-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:16px}
.mode-toggle button{flex:1;padding:8px 16px;border:none;background:var(--surface2);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.mode-toggle button.active{background:var(--accent);color:#fff}
.settings-section{margin-bottom:18px}
.settings-section h3{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.worker-controls{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--border);margin-top:8px}
.worker-status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{opacity:.85}
.btn-warning{background:var(--yellow);color:#000}.btn-warning:hover{opacity:.85}

/* Layout */
.container{max-width:1400px;margin:0 auto;padding:24px}
.top-row{display:grid;grid-template-columns:380px 1fr;gap:24px;margin-bottom:24px}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h2{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

/* Form */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%;margin-top:4px}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px}
tr:hover{background:var(--surface2);cursor:pointer}
.empty-row td{text-align:center;color:var(--text2);padding:40px}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase}
.badge-pending{background:#eab30820;color:var(--yellow)}
.badge-progress{background:#3b82f620;color:var(--blue)}
.badge-done{background:#22c55e20;color:var(--green)}
.badge-failed{background:#ef444420;color:var(--red)}
.badge-review{background:#f9731620;color:#f97316}

/* Inline pipeline progress (table rows) */
.pipeline-progress{display:flex;align-items:center;gap:2px;min-width:180px}
.pipeline-progress .pip{flex:1;height:6px;border-radius:3px;background:var(--surface2);transition:background .3s}
.pipeline-progress .pip.done{background:var(--green)}
.pipeline-progress .pip.current{background:var(--blue);animation:pipPulse 1.5s infinite}
.pipeline-progress .pip.failed{background:var(--red)}
.pipeline-progress .pip.review{background:#f97316}
@keyframes pipPulse{0%,100%{opacity:1}50%{opacity:.4}}
.pipeline-progress .pip.waiting{background:var(--yellow);animation:pipPulse 2s infinite}
.pipeline-label{font-size:11px;color:var(--text2);margin-left:6px;white-space:nowrap}
.pipeline-wrap{display:flex;flex-direction:column;gap:3px}
.pipeline-attempts{font-size:10px;color:var(--text2);display:flex;gap:6px}
.pipeline-attempts span{opacity:.6}
.pipeline-attempts span.active{opacity:1;color:var(--accent)}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:800px;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:18px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}

/* Progress bar */
.progress-bar{display:flex;gap:4px;margin-bottom:20px}
.progress-step{flex:1;text-align:center;padding:6px 0;font-size:10px;font-weight:600;border-radius:4px;background:var(--surface2);color:var(--text2)}
.progress-step.done{background:var(--green);color:#fff}
.progress-step.current{background:var(--blue);color:#fff}
.progress-step.failed{background:var(--red);color:#fff}

/* Detail sections */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.detail-item{font-size:13px}
.detail-item .label{color:var(--text2)}
.detail-item .value{font-weight:500;margin-top:2px}

.section{margin-bottom:20px}
.section h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text2)}

/* Assets */
.asset-list{display:flex;flex-direction:column;gap:8px}
.asset-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface2);border-radius:6px;font-size:13px}
.asset-item a{font-size:12px}

/* Script editor */
.script-area{width:100%;min-height:200px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;resize:vertical;outline:none}
.script-area:focus{border-color:var(--accent)}
.script-actions{display:flex;gap:8px;margin-top:8px}

/* Media */
.thumb-preview{max-width:100%;border-radius:6px;margin-top:8px}
.video-player{width:100%;border-radius:6px;margin-top:8px}

/* Thumbnail upload */
.thumb-upload{display:flex;align-items:center;gap:10px;margin-top:10px}
.thumb-upload input[type=file]{display:none}
.thumb-upload-label{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--surface2);border:1px dashed var(--border);border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s}
.thumb-upload-label:hover{border-color:var(--accent);color:var(--accent)}
.thumb-drop-zone{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;color:var(--text2);font-size:13px;margin-top:10px;transition:all .15s}
.thumb-drop-zone.dragover{border-color:var(--accent);background:rgba(99,102,241,.08);color:var(--accent)}

/* Error box */
.error-box{background:#ef444415;border:1px solid var(--red);border-radius:6px;padding:12px;color:var(--red);font-size:13px;margin-bottom:16px;white-space:pre-wrap}

/* Modal footer */
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:300;animation:slideIn .2s ease;color:#fff}
.toast-success{background:var(--green)}.toast-error{background:var(--red)}

/* Responsive */
@media(max-width:768px){.top-row{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>Sleepy</h1>
  <span class="subtitle" data-i18n="controlPanel"></span>
  <div class="header-right">
    <div class="worker-status" id="workerIndicator">
      <span class="worker-dot off" id="workerDot"></span>
      <span id="workerLabel" data-i18n="workerStopped"></span>
    </div>
    <button class="settings-btn" onclick="openSettings()" title="Settings">
      &#9881; <span data-i18n="settings"></span>
    </button>
    <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="tr">Turkce</option>
      <option value="pt">Portugues</option>
      <option value="es">Espanol</option>
      <option value="it">Italiano</option>
    </select>
  </div>
</header>

<div class="container">
  <div class="top-row">
    <!-- Create Form -->
    <div class="card">
      <h2 data-i18n="createEpisode"></h2>
      <form id="createForm">
        <div class="form-group">
          <label data-i18n="episode"></label>
          <input type="text" id="fEpisode" data-i18n-placeholder="episodePlaceholder">
        </div>
        <details id="advancedToggle" style="margin-bottom:12px">
          <summary style="cursor:pointer;color:var(--text2);font-size:0.9em;user-select:none" data-i18n="advanced"></summary>
          <div style="margin-top:8px">
            <div class="form-group">
              <label data-i18n="series"></label>
              <input type="text" id="fSeries" data-i18n-placeholder="seriesPlaceholder">
            </div>
            <div class="form-group">
              <label data-i18n="style"></label>
              <select id="fStyle">
                <option value="Cosmos">Cosmos</option>
                <option value="Earthside">Earthside</option>
                <option value="Myth">Myth</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="contentLanguage"></label>
              <select id="fLanguage">
                <option value="en">English</option>
                <option value="tr">Turkce</option>
                <option value="pt">Portugues</option>
                <option value="es">Espanol</option>
                <option value="it">Italiano</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="durationMin"></label>
              <input type="number" id="fDuration" value="3" min="1" max="180">
            </div>
          </div>
        </details>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="create"></button>
      </form>
    </div>

    <!-- Stats -->
    <div class="card">
      <h2 data-i18n="summary"></h2>
      <div id="statsArea" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px"></div>
    </div>
  </div>

  <!-- Runs Table -->
  <div class="card">
    <h2 data-i18n="allRuns"></h2>
    <div class="filters" id="filterBar"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="series"></th>
            <th data-i18n="episode"></th>
            <th data-i18n="style"></th>
            <th data-i18n="duration"></th>
            <th data-i18n="progress"></th>
            <th data-i18n="date"></th>
          </tr>
        </thead>
        <tbody id="runsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay" style="display:none" onclick="if(event.target===this)closeSettings()">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h2 data-i18n="settingsTitle"></h2>
      <button class="modal-close" onclick="closeSettings()">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Mode toggle -->
      <div class="settings-section">
        <h3 data-i18n="modeLabel"></h3>
        <div class="mode-toggle">
          <button id="modeTestBtn" onclick="setSettingsMode('test')" data-i18n="modeTest"></button>
          <button id="modeProdBtn" onclick="setSettingsMode('prod')" data-i18n="modeProd"></button>
        </div>
      </div>

      <!-- Test mode fields -->
      <div id="testFields" class="settings-section">
        <h3>OpenAI + Edge TTS</h3>
        <div class="settings-grid">
          <div class="form-group settings-full">
            <label>OpenAI API Key</label>
            <input type="password" id="sTestOpenAIKey" placeholder="sk-...">
          </div>
          <div class="form-group">
            <label>Model</label>
            <input type="text" id="sTestOpenAIModel" placeholder="gpt-4o-mini">
          </div>
          <div class="form-group">
            <label data-i18n="edgeVoice"></label>
            <select id="sEdgeVoice">
              <optgroup label="English">
                <option value="en-US-AndrewNeural">en-US-AndrewNeural</option>
                <option value="en-US-GuyNeural">en-US-GuyNeural</option>
                <option value="en-US-BrianNeural">en-US-BrianNeural</option>
              </optgroup>
              <optgroup label="Turkce">
                <option value="tr-TR-AhmetNeural">tr-TR-AhmetNeural</option>
                <option value="tr-TR-EmelNeural">tr-TR-EmelNeural</option>
              </optgroup>
              <optgroup label="Portugues">
                <option value="pt-BR-AntonioNeural">pt-BR-AntonioNeural</option>
                <option value="pt-BR-FranciscaNeural">pt-BR-FranciscaNeural</option>
              </optgroup>
              <optgroup label="Espanol">
                <option value="es-ES-AlvaroNeural">es-ES-AlvaroNeural</option>
                <option value="es-MX-JorgeNeural">es-MX-JorgeNeural</option>
              </optgroup>
              <optgroup label="Italiano">
                <option value="it-IT-DiegoNeural">it-IT-DiegoNeural</option>
                <option value="it-IT-IsabellaNeural">it-IT-IsabellaNeural</option>
              </optgroup>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="edgeRate"></label>
            <select id="sEdgeRate">
              <option value="-30%" data-i18n-label="edgeRateVerySlow">-30%</option>
              <option value="-20%" selected data-i18n-label="edgeRateSlow">-20%</option>
              <option value="-10%" data-i18n-label="edgeRateSlightlySlow">-10%</option>
              <option value="+0%" data-i18n-label="edgeRateNormal">+0%</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Prod mode fields -->
      <div id="prodFields" class="settings-section" style="display:none">
        <h3>OpenAI + ElevenLabs</h3>
        <div class="settings-grid">
          <div class="form-group settings-full">
            <label>OpenAI API Key</label>
            <input type="password" id="sOpenAIKey" placeholder="sk-...">
          </div>
          <div class="form-group">
            <label data-i18n="openaiBaseUrl"></label>
            <input type="text" id="sOpenAIBaseURL" placeholder="https://api.openai.com/v1">
          </div>
          <div class="form-group">
            <label data-i18n="openaiModel"></label>
            <input type="text" id="sOpenAIModel" placeholder="gpt-4o">
          </div>
          <div class="form-group settings-full">
            <label>ElevenLabs API Key</label>
            <input type="password" id="sElevenKey" placeholder="xi-...">
          </div>
          <div class="form-group">
            <label data-i18n="elevenVoiceId"></label>
            <input type="text" id="sElevenVoiceID">
          </div>
          <div class="form-group">
            <label data-i18n="elevenModelId"></label>
            <input type="text" id="sElevenModelID" placeholder="eleven_monolingual_v1">
          </div>
          <div class="form-group">
            <label><span data-i18n="elevenSpeed"></span>: <span id="sElevenSpeedVal">0.80</span></label>
            <input type="range" id="sElevenSpeed" step="0.05" min="0.25" max="2.0" value="0.80" oninput="document.getElementById('sElevenSpeedVal').textContent=parseFloat(this.value).toFixed(2)" style="width:100%;accent-color:var(--accent)">
          </div>
        </div>
      </div>

      <!-- Common -->
      <div class="settings-section">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" id="sNormalize" checked>
          <span data-i18n="normalizeAudio"></span>
        </label>
      </div>

      <button class="btn btn-primary btn-block" onclick="saveSettings()" data-i18n="saveSettings"></button>

      <!-- Worker controls -->
      <div class="worker-controls">
        <button class="btn btn-success btn-sm" id="workerStartBtn" onclick="startWorker()" data-i18n="workerStart"></button>
        <button class="btn btn-danger btn-sm" id="workerStopBtn" onclick="stopWorker()" style="display:none" data-i18n="workerStop"></button>
        <div class="worker-status">
          <span class="worker-dot off" id="settingsWorkerDot"></span>
          <span id="settingsWorkerLabel" data-i18n="workerStopped"></span>
        </div>
      </div>
    </div>
  </div>
</div>

let currentLang = localStorage.getItem('sleepy-lang') || 'en';

function t(key){ return (LANGS[currentLang] && LANGS[currentLang][key]) || LANGS.en[key] || key; }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('sleepy-lang', lang);
  document.getElementById('langSelect').value = lang;
  document.documentElement.lang = lang;
  document.title = 'Sleepy - ' + t('controlPanel');
  applyI18n();
  renderStats(); renderFilters(); renderTable();
}

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll('[data-i18n-label]').forEach(el=>{
    el.textContent = el.value + ' (' + t(el.dataset.i18nLabel) + ')';
  });
}

// ==================== App State ====================
const API = '';
let allRuns = [];
let currentFilter = 'ALL';
let refreshTimer = null;
let detailPollTimer = null;
let detailRunID = null;

const STATUSES = ['ALL','PENDING','SCRIPTED','VOICED','THUMBNAILED','RENDERED','PACKAGED','DONE','FAILED','NEEDS_REVIEW'];
const PIPELINE = ['PENDING','SCRIPTED','VOICED','THUMBNAILED','RENDERED','PACKAGED','DONE'];

function statusClass(s){
  if(s==='DONE'||s==='PACKAGED')return 'badge-done';
  if(s==='FAILED')return 'badge-failed';
  if(s==='NEEDS_REVIEW')return 'badge-review';
  if(s==='PENDING')return 'badge-pending';
  return 'badge-progress';
}

function dateLang(){
  const map={en:'en-US',tr:'tr-TR',pt:'pt-BR',es:'es-ES',it:'it-IT'};
  return map[currentLang]||'en-US';
}

function fmtDate(d){
  if(!d)return '-';
  const dt=new Date(d);
  return dt.toLocaleDateString(dateLang())+' '+dt.toLocaleTimeString(dateLang(),{hour:'2-digit',minute:'2-digit'});
}

function toast(msg,type='success'){
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}

function langDisplay(code){
  const map={en:'langEn',tr:'langTr',pt:'langPt',es:'langEs',it:'langIt'};
  return t(map[code]||'langEn');
}

// ==================== Filters ====================
function renderFilters(){
  const bar=document.getElementById('filterBar');
  bar.innerHTML='';
  STATUSES.forEach(s=>{
    const b=document.createElement('button');
    b.className='filter-btn'+(currentFilter===s?' active':'');
    const count=s==='ALL'?allRuns.length:allRuns.filter(r=>r.Status===s).length;
    b.textContent=s+' ('+count+')';
    b.onclick=()=>{currentFilter=s;renderFilters();renderTable()};
    bar.appendChild(b);
  });
}

// ==================== Stats ====================
function renderStats(){
  const area=document.getElementById('statsArea');
  const counts={};
  STATUSES.slice(1).forEach(s=>counts[s]=0);
  allRuns.forEach(r=>counts[r.Status]=(counts[r.Status]||0)+1);
  area.innerHTML='';
  [[t('total'),allRuns.length,'var(--accent)'],[t('pending'),counts.PENDING||0,'var(--yellow)'],[t('inProgress'),(counts.SCRIPTED||0)+(counts.VOICED||0)+(counts.THUMBNAILED||0)+(counts.RENDERED||0)+(counts.PACKAGED||0),'var(--blue)'],[t('completed'),counts.DONE||0,'var(--green)'],[t('failed'),counts.FAILED||0,'var(--red)']].forEach(([label,val,color])=>{
    area.innerHTML+=`<div style="background:var(--surface2);border-radius:8px;padding:16px;text-align:center">
      <div style="font-size:28px;font-weight:700;color:${color}">${val}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px">${label}</div></div>`;
  });
}

// ==================== Table ====================
function renderTable(){
  const body=document.getElementById('runsBody');
  const filtered=currentFilter==='ALL'?allRuns:allRuns.filter(r=>r.Status===currentFilter);
  if(!filtered.length){
    body.innerHTML=`<tr class="empty-row"><td colspan="6">${t('noRunsYet')}</td></tr>`;
    return;
  }
  body.innerHTML=filtered.map(r=>`<tr onclick="openDetail('${r.ID}')">
    <td>${esc(r.Series)}</td>
    <td>${esc(r.Episode)}</td>
    <td>${esc(r.Style)}</td>
    <td>${r.DurationMin} ${t('minuteShort')}</td>
    <td>${renderPipelineProgress(r)}</td>
    <td>${fmtDate(r.CreatedAt)}</td>
  </tr>`).join('');
}

function renderPipelineProgress(run){
  // 6 steps: PENDING→SCRIPTED→VOICED→THUMBNAILED→RENDERED→PACKAGED→DONE
  const steps=[
    {status:'PENDING',    label:t('stageScript')},
    {status:'SCRIPTED',   label:t('stageVoice')},
    {status:'VOICED',     label:t('stageThumbnail')},
    {status:'THUMBNAILED',label:t('stageRender')},
    {status:'RENDERED',   label:t('stagePackage')},
    {status:'PACKAGED',   label:t('stageDone')},
  ];
  const isFailed=run.Status==='FAILED';
  const isReview=run.Status==='NEEDS_REVIEW';
  const isDone=run.Status==='DONE';
  const isWaiting=run.Status==='SCRIPTED' && !run.VoiceApproved;
  const curIdx=PIPELINE.indexOf(run.Status);

  let pips='';
  let currentLabel='';
  steps.forEach((step,i)=>{
    const stepIdx=PIPELINE.indexOf(step.status);
    let cls='';
    if(isDone){
      cls='done';
    } else if(isFailed){
      cls=stepIdx<curIdx?'done':stepIdx===curIdx?'failed':'';
    } else if(isReview){
      cls=stepIdx<curIdx?'done':stepIdx===curIdx?'review':'';
    } else if(isWaiting){
      cls=stepIdx<curIdx?'done':stepIdx===curIdx?'waiting':'';
    } else {
      if(stepIdx<curIdx) cls='done';
      else if(stepIdx===curIdx) cls='current';
    }
    if(stepIdx===curIdx && !isDone) currentLabel=step.label;
    pips+=`<div class="pip ${cls}" title="${step.label}"></div>`;
  });

  // Status label with badge
  let label='';
  if(isDone){
    label=`<span class="badge badge-done">DONE</span>`;
  } else if(isFailed){
    label=`<span class="badge badge-failed">FAILED</span>`;
  } else if(isReview){
    label=`<span class="badge badge-review">REVIEW</span>`;
  } else if(isWaiting){
    label=`<span class="badge badge-pending">${t('awaitingApproval')}</span>`;
  } else {
    label=`<span class="pipeline-label">${currentLabel}</span>`;
  }

  // Attempt counters
  const totalAttempts=(run.ScriptAttempt||0)+(run.VoiceAttempt||0)+(run.RenderAttempt||0)+(run.PackageAttempt||0);
  let attemptsHTML='';
  if(totalAttempts>0){
    const parts=[];
    if(run.ScriptAttempt) parts.push(`<span class="${run.Status==='PENDING'?'active':''}">S:${run.ScriptAttempt}</span>`);
    if(run.VoiceAttempt) parts.push(`<span class="${run.Status==='SCRIPTED'?'active':''}">V:${run.VoiceAttempt}</span>`);
    if(run.RenderAttempt) parts.push(`<span class="${run.Status==='THUMBNAILED'?'active':''}">R:${run.RenderAttempt}</span>`);
    if(run.PackageAttempt) parts.push(`<span class="${run.Status==='RENDERED'?'active':''}">P:${run.PackageAttempt}</span>`);
    attemptsHTML=`<div class="pipeline-attempts">${parts.join('')}</div>`;
  }

  return `<div class="pipeline-wrap">
    <div style="display:flex;align-items:center">${pips}${label}</div>
    ${attemptsHTML}
  </div>`;
}

// ==================== Fetch runs ====================
async function fetchRuns(){
  try{
    const res=await fetch(API+'/api/runs');
    allRuns=await res.json();
    renderStats();renderFilters();renderTable();
  }catch(e){console.error('fetch runs:',e)}
}

// ==================== Create run ====================
document.getElementById('createForm').onsubmit=async(e)=>{
  e.preventDefault();
  const adv=document.getElementById('advancedToggle').open;
  const body={
    episode:document.getElementById('fEpisode').value.trim(),
    series:adv?document.getElementById('fSeries').value.trim():'',
    style:adv?document.getElementById('fStyle').value:'',
    language:adv?document.getElementById('fLanguage').value:'',
    duration_min:adv?(parseInt(document.getElementById('fDuration').value)||30):0
  };
  try{
    const res=await fetch(API+'/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('runCreated'));
    document.getElementById('createForm').reset();
    document.getElementById('fDuration').value='30';
    fetchRuns();
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
};

// ==================== Detail modal ====================
async function openDetail(id){
  document.getElementById('modalOverlay').style.display='flex';
  document.getElementById('modalBody').innerHTML=`<p style="color:var(--text2)">${t('loading')}</p>`;
  document.getElementById('modalFooter').innerHTML='';
  detailRunID=id;
  if(detailPollTimer){clearInterval(detailPollTimer);detailPollTimer=null}
  try{
    const res=await fetch(API+'/api/runs/'+id);
    const data=await res.json();
    renderDetail(data);
    // Poll for all non-terminal states (including SCRIPTED awaiting approval).
    if(data.run.Status!=='DONE'&&data.run.Status!=='FAILED'){
      detailPollTimer=setInterval(()=>pollDetail(id),3000);
    }
  }catch(e){
    document.getElementById('modalBody').innerHTML=`<p style="color:var(--red)">${t('loadError')}</p>`;
  }
}

async function pollDetail(id){
  if(detailRunID!==id){clearInterval(detailPollTimer);detailPollTimer=null;return}
  try{
    const res=await fetch(API+'/api/runs/'+id);
    const data=await res.json();
    renderDetail(data);
    if(data.run.Status==='DONE'||data.run.Status==='FAILED'){
      clearInterval(detailPollTimer);detailPollTimer=null;
      fetchRuns();
    }
  }catch(e){console.error('poll detail:',e)}
}

function closeModal(){
  document.getElementById('modalOverlay').style.display='none';
  detailRunID=null;
  if(detailPollTimer){clearInterval(detailPollTimer);detailPollTimer=null}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSettings()}});

function kindLabel(kind){
  const map={script_md:t('scriptMd'),script_ssml:t('scriptSsml'),narration_wav:t('narrationWav'),thumbnail_png:t('thumbnailPng'),video_mp4:t('videoMp4'),metadata_json:t('metadataJson'),episode_pack_zip:t('episodePack')};
  return map[kind]||kind;
}

function renderDetail(data){
  const run=data.run;
  const assets=data.assets||[];

  document.getElementById('modalTitle').textContent=run.Series+' - '+run.Episode;

  // Progress bar
  let progressHTML='<div class="progress-bar">';
  const curIdx=PIPELINE.indexOf(run.Status);
  PIPELINE.forEach((step,i)=>{
    let cls='';
    if(run.Status==='FAILED') cls=i<=curIdx?'failed':'';
    else if(i<curIdx) cls='done';
    else if(i===curIdx) cls='current';
    progressHTML+=`<div class="progress-step ${cls}">${step}</div>`;
  });
  progressHTML+='</div>';

  // Detail grid
  let detailHTML=`<div class="detail-grid">
    <div class="detail-item"><div class="label">${t('series')}</div><div class="value">${esc(run.Series)}</div></div>
    <div class="detail-item"><div class="label">${t('episode')}</div><div class="value">${esc(run.Episode)}</div></div>
    <div class="detail-item"><div class="label">${t('style')}</div><div class="value">${esc(run.Style)}</div></div>
    <div class="detail-item"><div class="label">${t('language')}</div><div class="value">${langDisplay(run.Language)}</div></div>
    <div class="detail-item"><div class="label">${t('duration')}</div><div class="value">${run.DurationMin} ${t('minuteLong')}</div></div>
    <div class="detail-item"><div class="label">${t('status')}</div><div class="value"><span class="badge ${statusClass(run.Status)}">${run.Status}</span></div></div>
    <div class="detail-item"><div class="label">${t('createdAt')}</div><div class="value">${fmtDate(run.CreatedAt)}</div></div>
  </div>`;

  // Voice approval banner
  let approvalHTML='';
  if(run.Status==='SCRIPTED' && !run.VoiceApproved){
    approvalHTML=`<div style="background:#eab30815;border:1px solid var(--yellow);border-radius:8px;padding:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div>
        <div style="font-weight:600;color:var(--yellow);margin-bottom:4px">${t('awaitingApproval')}</div>
        <div style="font-size:13px;color:var(--text2)">${t('approveVoiceDesc')}</div>
      </div>
      <button class="btn btn-success" onclick="approveVoice('${run.ID}')" style="white-space:nowrap;padding:10px 24px;font-size:15px">${t('approveVoice')}</button>
    </div>`;
  }

  // Error box
  let errorHTML='';
  if(run.Status==='FAILED'&&run.ErrorText){
    errorHTML=`<div class="error-box"><strong>${t('error')}:</strong>\n${esc(run.ErrorText)}</div>`;
  }

  // Assets
  let assetsHTML='';
  if(assets.length){
    assetsHTML=`<div class="section"><h3>${t('generatedFiles')}</h3><div class="asset-list">`;
    assets.forEach(a=>{
      const fname=a.Path.split('/').pop();
      const url=API+'/assets/'+run.ID+'/'+fname;
      assetsHTML+=`<div class="asset-item"><span>${kindLabel(a.Kind)} &mdash; ${fname}</span><a href="${url}" target="_blank">${t('viewDownload')}</a></div>`;
    });
    assetsHTML+='</div></div>';
  }

  // Thumbnail preview + upload
  const thumbAsset=assets.find(a=>a.Kind==='thumbnail_png');
  let thumbHTML=`<div class="section"><h3>${t('thumbnail')}</h3>`;
  if(thumbAsset){
    const fname=thumbAsset.Path.split('/').pop();
    thumbHTML+=`<img class="thumb-preview" id="thumbPreview" src="${API}/assets/${run.ID}/${fname}?t=${Date.now()}" alt="thumbnail">`;
  } else {
    thumbHTML+=`<div id="thumbPreview" style="color:var(--text2);font-size:13px;margin-bottom:4px">${t('noThumbnail')}</div>`;
  }
  thumbHTML+=`<div class="thumb-upload">
    <label class="thumb-upload-label" for="thumbFileInput">${t('selectImage')}</label>
    <input type="file" id="thumbFileInput" accept="image/*" onchange="uploadThumbnail('${run.ID}',this.files[0])">
    <span id="thumbFileName" style="font-size:12px;color:var(--text2)"></span>
    <span id="thumbUploading" style="font-size:12px;color:var(--accent);display:none">${t('uploading')}</span>
  </div>
  <div class="thumb-drop-zone" id="thumbDropZone">${t('dropImageHere')}</div>
  </div>`;

  // Video player
  let videoHTML='';
  const videoAsset=assets.find(a=>a.Kind==='video_mp4');
  if(videoAsset){
    const fname=videoAsset.Path.split('/').pop();
    videoHTML=`<div class="section"><h3>${t('video')}</h3><video class="video-player" controls><source src="${API}/assets/${run.ID}/${fname}" type="video/mp4">${t('videoNotSupported')}</video></div>`;
  }

  // Script section
  const scriptAsset=assets.find(a=>a.Kind==='script_md');
  let scriptHTML='';
  if(scriptAsset){
    scriptHTML=`<div class="section"><h3>Script</h3>
      <div id="scriptLoading" style="color:var(--text2)">${t('scriptLoading')}</div>
      <textarea class="script-area" id="scriptEditor" style="display:none"></textarea>
      <div class="script-actions" id="scriptActions" style="display:none">
        <button class="btn btn-primary btn-sm" onclick="saveScript('${run.ID}')">${t('save')}</button>
        <button class="btn btn-sm" style="background:var(--surface2);color:var(--text)" onclick="loadScript('${run.ID}')">${t('reset')}</button>
      </div>
    </div>`;
  }

  // Autopilot info (attempts + last error)
  let autopilotHTML='';
  if(run.ScriptAttempt||run.VoiceAttempt||run.RenderAttempt||run.PackageAttempt){
    autopilotHTML='<div class="section"><h3>Autopilot</h3><div class="detail-grid">';
    autopilotHTML+=`<div class="detail-item"><div class="label">Script Attempts</div><div class="value">${run.ScriptAttempt}</div></div>`;
    autopilotHTML+=`<div class="detail-item"><div class="label">Voice Attempts</div><div class="value">${run.VoiceAttempt}</div></div>`;
    autopilotHTML+=`<div class="detail-item"><div class="label">Render Attempts</div><div class="value">${run.RenderAttempt}</div></div>`;
    autopilotHTML+=`<div class="detail-item"><div class="label">Package Attempts</div><div class="value">${run.PackageAttempt}</div></div>`;
    autopilotHTML+='</div>';
    if(run.LastError){
      autopilotHTML+=`<div class="error-box" style="margin-top:10px"><strong>Last Error:</strong>\n${esc(run.LastError)}</div>`;
    }
    autopilotHTML+='</div>';
  }

  document.getElementById('modalBody').innerHTML=progressHTML+approvalHTML+errorHTML+detailHTML+autopilotHTML+assetsHTML+thumbHTML+videoHTML+scriptHTML;

  // Footer buttons
  let footerHTML='';
  if(run.Status==='FAILED'||run.Status==='NEEDS_REVIEW'){
    footerHTML+=`<button class="btn btn-primary btn-sm" onclick="retryRun('${run.ID}')">${t('retry')}</button>`;
  }
  footerHTML+=`<button class="btn btn-danger btn-sm" onclick="deleteRun('${run.ID}')">${t('delete')}</button>`;
  document.getElementById('modalFooter').innerHTML=footerHTML;

  // Setup thumbnail drop zone
  const dropZone=document.getElementById('thumbDropZone');
  if(dropZone){
    dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
    dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop',e=>{
      e.preventDefault();dropZone.classList.remove('dragover');
      const file=e.dataTransfer.files[0];
      if(file&&file.type.startsWith('image/'))uploadThumbnail(run.ID,file);
      else toast(t('onlyImages'),'error');
    });
  }

  // Load script content
  if(scriptAsset)loadScript(run.ID);
}

// ==================== Script ====================
async function loadScript(runID){
  try{
    const res=await fetch(API+'/api/runs/'+runID+'/script');
    if(!res.ok)throw new Error(t('scriptLoadError'));
    const text=await res.text();
    const editor=document.getElementById('scriptEditor');
    const loading=document.getElementById('scriptLoading');
    const actions=document.getElementById('scriptActions');
    editor.value=text;
    editor.style.display='block';
    loading.style.display='none';
    actions.style.display='flex';
  }catch(e){
    document.getElementById('scriptLoading').textContent=t('scriptLoadError')+': '+e.message;
  }
}

async function saveScript(runID){
  const content=document.getElementById('scriptEditor').value;
  try{
    const res=await fetch(API+'/api/runs/'+runID+'/script',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content})
    });
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('scriptSaved'));
  }catch(e){toast(t('scriptSaveError')+': '+e.message,'error')}
}

// ==================== Thumbnail upload ====================
async function uploadThumbnail(runID,file){
  if(!file)return;
  if(!file.type.startsWith('image/')){toast(t('onlyImages'),'error');return}
  const nameEl=document.getElementById('thumbFileName');
  const uploadingEl=document.getElementById('thumbUploading');
  if(nameEl)nameEl.textContent=file.name;
  if(uploadingEl)uploadingEl.style.display='inline';
  try{
    const fd=new FormData();
    fd.append('file',file);
    const res=await fetch(API+'/api/runs/'+runID+'/thumbnail',{method:'PUT',body:fd});
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('thumbnailUpdated'));
    openDetail(runID);
  }catch(e){toast(t('uploadError')+': '+e.message,'error')}
  finally{if(uploadingEl)uploadingEl.style.display='none'}
}

// ==================== Retry / Delete ====================
async function approveVoice(id){
  try{
    const res=await fetch(API+'/api/runs/'+id+'/approve-voice',{method:'POST'});
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('voiceApproved'));
    openDetail(id);
    fetchRuns();
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
}

async function retryRun(id){
  try{
    const res=await fetch(API+'/api/runs/'+id+'/retry',{method:'POST'});
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('runRequeued'));
    closeModal();fetchRuns();
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
}

async function deleteRun(id){
  if(!confirm(t('confirmDelete')))return;
  try{
    const res=await fetch(API+'/api/runs/'+id,{method:'DELETE'});
    if(!res.ok)throw new Error(t('deleteError'));
    toast(t('runDeleted'));
    closeModal();fetchRuns();
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
}

// ==================== Settings ====================
let settingsMode = 'test';

function openSettings(){
  document.getElementById('settingsOverlay').style.display='flex';
  loadSettings();
}
function closeSettings(){document.getElementById('settingsOverlay').style.display='none'}

function setSettingsMode(mode){
  settingsMode=mode;
  document.getElementById('modeTestBtn').className=mode==='test'?'active':'';
  document.getElementById('modeProdBtn').className=mode==='prod'?'active':'';
  document.getElementById('testFields').style.display=mode==='test'?'block':'none';
  document.getElementById('prodFields').style.display=mode==='prod'?'block':'none';
}

async function loadSettings(){
  try{
    const res=await fetch(API+'/api/settings');
    const s=await res.json();
    setSettingsMode(s.mode||'test');
    document.getElementById('sTestOpenAIKey').value=s.openai_api_key||'';
    document.getElementById('sTestOpenAIModel').value=s.openai_model||'';
    document.getElementById('sOpenAIKey').value=s.openai_api_key||'';
    document.getElementById('sOpenAIBaseURL').value=s.openai_base_url||'';
    document.getElementById('sOpenAIModel').value=s.openai_model||'';
    document.getElementById('sElevenKey').value=s.elevenlabs_api_key||'';
    document.getElementById('sElevenVoiceID').value=s.elevenlabs_voice_id||'';
    document.getElementById('sElevenModelID').value=s.elevenlabs_model_id||'';
    const speedVal=s.elevenlabs_speed||0.80;
    document.getElementById('sElevenSpeed').value=speedVal;
    document.getElementById('sElevenSpeedVal').textContent=parseFloat(speedVal).toFixed(2);
    if(s.edge_voice)document.getElementById('sEdgeVoice').value=s.edge_voice;
    if(s.edge_rate)document.getElementById('sEdgeRate').value=s.edge_rate;
    document.getElementById('sNormalize').checked=s.normalize!==false;
  }catch(e){console.error('load settings:',e)}
}

async function saveSettings(){
  const isTest=settingsMode==='test';
  const body={
    mode:settingsMode,
    openai_api_key:isTest?document.getElementById('sTestOpenAIKey').value:document.getElementById('sOpenAIKey').value,
    openai_base_url:isTest?'':document.getElementById('sOpenAIBaseURL').value,
    openai_model:isTest?document.getElementById('sTestOpenAIModel').value:document.getElementById('sOpenAIModel').value,
    elevenlabs_api_key:document.getElementById('sElevenKey').value,
    elevenlabs_voice_id:document.getElementById('sElevenVoiceID').value,
    elevenlabs_model_id:document.getElementById('sElevenModelID').value,
    elevenlabs_speed:parseFloat(document.getElementById('sElevenSpeed').value)||0.80,
    edge_voice:document.getElementById('sEdgeVoice').value,
    edge_rate:document.getElementById('sEdgeRate').value,
    normalize:document.getElementById('sNormalize').checked
  };
  try{
    const res=await fetch(API+'/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('settingsSaved'));
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
}

// ==================== Worker control ====================
async function pollWorkerStatus(){
  try{
    const res=await fetch(API+'/api/worker/status');
    const data=await res.json();
    updateWorkerUI(data.running);
  }catch(e){console.error('worker status:',e)}
}

function updateWorkerUI(running){
  const dot=document.getElementById('workerDot');
  const label=document.getElementById('workerLabel');
  const sDot=document.getElementById('settingsWorkerDot');
  const sLabel=document.getElementById('settingsWorkerLabel');
  const startBtn=document.getElementById('workerStartBtn');
  const stopBtn=document.getElementById('workerStopBtn');

  if(running){
    dot.className='worker-dot on';
    label.textContent=t('workerRunning');
    if(sDot){sDot.className='worker-dot on';sLabel.textContent=t('workerRunning')}
    startBtn.style.display='none';
    stopBtn.style.display='inline-block';
  }else{
    dot.className='worker-dot off';
    label.textContent=t('workerStopped');
    if(sDot){sDot.className='worker-dot off';sLabel.textContent=t('workerStopped')}
    startBtn.style.display='inline-block';
    stopBtn.style.display='none';
  }
}

async function startWorker(){
  try{
    const res=await fetch(API+'/api/worker/start',{method:'POST'});
    if(!res.ok){
      const err=await res.json();
      toast(err.error||t('missingApiKey'),'error');
      return;
    }
    toast(t('workerStarted'));
    pollWorkerStatus();
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
}

async function stopWorker(){
  try{
    const res=await fetch(API+'/api/worker/stop',{method:'POST'});
    if(!res.ok)throw new Error((await res.json()).error);
    toast(t('workerStoppedMsg'));
    pollWorkerStatus();
  }catch(e){toast(t('errorPrefix')+': '+e.message,'error')}
}

// ==================== Init ====================
document.getElementById('langSelect').value=currentLang;
setLang(currentLang);
fetchRuns();
refreshTimer=setInterval(fetchRuns,10000);
pollWorkerStatus();
setInterval(pollWorkerStatus,5000);
</script>
